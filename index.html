<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #6b7280;
      font-size: 1rem;
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .course-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1.75rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: block;
    }

    .course-card:hover {
      border-color: #0969da;
      box-shadow: 0 4px 12px rgba(9, 105, 218, 0.1);
      transform: translateY(-2px);
    }

    .course-icon {
      width: 48px;
      height: 48px;
      background: #eff6ff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .course-card:hover .course-icon {
      background: #dbeafe;
    }

    .course-code {
      font-size: 0.75rem;
      font-weight: 600;
      color: #0969da;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .course-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .course-desc {
      font-size: 0.9rem;
      color: #6b7280;
      line-height: 1.5;
    }

    .course-arrow {
      margin-top: 1rem;
      color: #9ca3af;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .course-card:hover .course-arrow {
      color: #0969da;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      font-size: 0.875rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1rem;
      }

      header h1 {
        font-size: 1.5rem;
      }

      .course-card {
        padding: 1.25rem;
      }

      .course-title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Lecture Notes</h1>
    </header>

    <div class="courses">
      <a href="physics/" class="course-card">
        <div class="course-icon">⚛️</div>
        <div class="course-code">TRM 1002</div>
        <div class="course-title">Fisika dan Mekanika Teknik</div>
        <div class="course-desc">Pengantar fisika, besaran & satuan, kinematika, dinamika, dan statika.</div>
        <div class="course-arrow">Buka materi →</div>
      </a>

      <a href="material/" class="course-card">
        <div class="course-icon">🔩</div>
        <div class="course-code">TRM 1003</div>
        <div class="course-title">Material Teknik</div>
        <div class="course-desc">Jenis material, sifat mekanik, logam, polimer, keramik, dan komposit.</div>
        <div class="course-arrow">Buka materi →</div>
      </a>
    </div>

    <footer>
      Fajrul Falah, S.Si, M.Sc &copy; 2026
    </footer>
  </div>
</body>
</html>
